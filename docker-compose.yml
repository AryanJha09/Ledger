# Reproduce the study:
#   docker compose up -d ollama          # model server (GPU if available)
#   docker compose run --rm ledger make pull
#   docker compose run --rm ledger make run-main
#   docker compose run --rm ledger make report
services:
  ollama:
    # Pin the server version; it is also recorded in every run's environment.json.
    image: ollama/ollama:0.15.0   # same version as the native server used for the reported runs
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1      # one request at a time: identical scheduling across runs
      - OLLAMA_KEEP_ALIVE=30m
    # Remove this block on machines without an NVIDIA GPU (CPU works, slower).
    # On macOS, run Ollama natively instead and set OLLAMA_HOST=http://host.docker.internal:11434.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ledger:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
    volumes:
      - ./results:/work/results
      - ./annotation:/work/annotation
    depends_on:
      - ollama

volumes:
  ollama-models:
